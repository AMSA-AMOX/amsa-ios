name: AMSA

options:
  bundleIdPrefix: mn.amsa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  AMSA:
    type: application
    platform: iOS
    sources:
      - path: AMSA
        excludes:
          - "Resources/Fonts/OFL.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.amsa.app
        PRODUCT_NAME: AMSA
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(AMSA_DEVELOPMENT_TEAM)
        ENABLE_PREVIEWS: YES
    info:
      path: AMSA/Info.plist
      properties:
        CFBundleDisplayName: AMSA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        # The web has no dark mode; the app mirrors it.
        UIUserInterfaceStyle: Light
        # The web switches to its desktop layout at ≥768px, wider than a landscape iPhone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Urbanist-Regular.ttf
          - Urbanist-Medium.ttf
          - Urbanist-SemiBold.ttf
        # Public configuration (see Config/*.xcconfig, scripts/gen-secrets.sh).
        AMSAAPIBaseURL: $(API_BASE_URL)
        AMSASupabaseURL: $(SUPABASE_URL)
        AMSASupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AMSALogoDevToken: $(LOGO_DEV_TOKEN)
        AMSATurnstileSiteKey: $(TURNSTILE_SITE_KEY)

  AMSATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AMSATests
    dependencies:
      - target: AMSA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.amsa.app.tests
        GENERATE_INFOPLIST_FILE: YES

  AMSAUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AMSAUITests
    dependencies:
      - target: AMSA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.amsa.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AMSA

schemes:
  AMSA:
    build:
      targets:
        AMSA: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AMSATests
        - AMSAUITests
      environmentVariables:
        # Opt-in live contract tests (read-only GETs). Leave empty to skip.
        AMSA_TEST_EMAIL: ""
        AMSA_TEST_PASSWORD: ""
    archive:
      config: Release
